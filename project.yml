name: Figurinhas
fileGroups:
  - Store/BodyCreator.storekit
options:
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  postGenCommand: /usr/bin/python3 Scripts/enable_iap_capability.py
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Figurinhas:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Catalog
        optional: true
      - path: Favorites
        optional: true
      - path: Export
        optional: true
      - path: Administration
        optional: true
      - path: Store
        excludes: [BodyCreator.storekit]
        optional: true
      - path: UI
        optional: true
      - path: Content
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Validate Content
        script: /usr/bin/python3 "$SRCROOT/Scripts/validate_content.py" "$SRCROOT/Content"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daige.bodycreator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          API_BASE_URL: "https://api-bodycreator.jusdock.com.br"
        Release:
          API_BASE_URL: "https://api-bodycreator.jusdock.com.br"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Body Creator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: $(API_BASE_URL)
        LSApplicationQueriesSchemes: [instagram, instagram-stories]
        CFBundleURLTypes:
          - CFBundleURLName: com.daige.bodycreator
            CFBundleURLSchemes: [bodycreator]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Durante os testes pelo Xcode, o Body Creator acessa a API executada neste Mac para validar login, catálogo e compras.
        NSCameraUsageDescription: O Body Creator usa a câmera para você fotografar o paciente e enviar a foto com a figurinha direto para o seu story. A foto não é salva nem enviada para nenhum servidor.
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FigurinhasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Store/BodyCreator.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
  FigurinhasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Store/BodyCreator.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
schemes:
  Figurinhas:
    build:
      targets:
        Figurinhas: all
    test:
      gatherCoverageData: false
      targets:
        - FigurinhasTests
        - FigurinhasUITests
    run:
      config: Debug
      storeKitConfiguration: Store/BodyCreator.storekit
      environmentVariables:
        # Debug já aponta para a VPS (ver API_BASE_URL acima), então abrir o app
        # pelo ícone no iPhone também funciona. Esta env var só é aplicada quando
        # o Xcode lança o app (Run) e serve de override para dev local: troque
        # para o host do Mac (ex.: http://MacBook-Pro-de-Felipe.local:3000).
        BODYCREATOR_API_URL: https://api-bodycreator.jusdock.com.br
