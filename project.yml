name: Figurinhas
options:
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Figurinhas:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Catalog
        optional: true
      - path: Favorites
        optional: true
      - path: Export
        optional: true
      - path: UI
        optional: true
      - path: Content
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Validate Content
        script: /usr/bin/python3 "$SRCROOT/Scripts/validate_content.py" "$SRCROOT/Content"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daige.bodycreator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Body Creator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [instagram]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FigurinhasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
  FigurinhasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
schemes:
  Figurinhas:
    build:
      targets:
        Figurinhas: all
    test:
      gatherCoverageData: false
      targets:
        - FigurinhasTests
        - FigurinhasUITests
