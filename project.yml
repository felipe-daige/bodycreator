name: Figurinhas
options:
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Figurinhas:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Catalog
        optional: true
      - path: Favorites
        optional: true
      - path: Export
        optional: true
      - path: Administration
        optional: true
      - path: UI
        optional: true
      - path: Content
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Validate Content
        script: /usr/bin/python3 "$SRCROOT/Scripts/validate_content.py" "$SRCROOT/Content"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daige.bodycreator
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          API_BASE_URL: "http://127.0.0.1:3000"
        Release:
          API_BASE_URL: "https://api.seudominio.com.br"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Body Creator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: $(API_BASE_URL)
        LSApplicationQueriesSchemes: [instagram, instagram-stories]
        CFBundleURLTypes:
          - CFBundleURLName: com.daige.bodycreator
            CFBundleURLSchemes: [bodycreator]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: O Body Creator usa a câmera para você fotografar o paciente e enviar a foto com a figurinha direto para o seu story. A foto não é salva nem enviada para nenhum servidor.
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FigurinhasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
  FigurinhasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
schemes:
  Figurinhas:
    build:
      targets:
        Figurinhas: all
    test:
      gatherCoverageData: false
      targets:
        - FigurinhasTests
        - FigurinhasUITests
