name: Figurinhas
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Figurinhas:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Catalog
        optional: true
      - path: Favorites
        optional: true
      - path: Export
        optional: true
      - path: UI
        optional: true
      - path: Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daige.figurinhas
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Figurinhas
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationQueriesSchemes: [instagram]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FigurinhasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Figurinhas
schemes:
  Figurinhas:
    build:
      targets:
        Figurinhas: all
    test:
      gatherCoverageData: false
      targets:
        - FigurinhasTests
