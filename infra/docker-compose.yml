services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  api:
    image: ghcr.io/${GH_REPO}/api:${TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    # Só API_DOMAIN, não env_file: [.env] inteiro — o Caddy não precisa de
    # SESSION_SECRET, DATABASE_URL nem das chaves do R2. Passar o arquivo
    # todo daria a esse container acesso a segredos que ele nunca usa.
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  caddy_data:
